<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account | BlogSpace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="/">BlogSpace</a><nav><a href="/">Home</a></nav></header>
  <main class="container narrow">
    <section class="panel">
      <p class="eyebrow">YOUR ACCOUNT</p><h1>Welcome to BlogSpace</h1>
      <div class="tabs"><button id="showLogin" class="tab active" type="button">Login</button><button id="showRegister" class="tab" type="button">Register</button></div>
      <form id="loginForm">
        <label>Email<input name="email" type="email" required placeholder="you@example.com"></label>
        <label>Password<input name="password" type="password" required placeholder="At least 8 characters"></label>
        <button class="button full" type="submit">Login</button>
      </form>
      <form id="registerForm" class="hidden">
        <label>Your name<input name="name" required maxlength="60" placeholder="Your name"></label>
        <label>Email<input name="email" type="email" required placeholder="you@example.com"></label>
        <label>Password<input name="password" type="password" minlength="8" required placeholder="Create a password"></label>
        <button class="button full" type="submit">Create account</button>
      </form>
      <p id="authMessage" class="status" aria-live="polite"></p>
    </section>
    <section id="writePanel" class="panel hidden">
      <h2>Create a blog post</h2>
      <form id="blogForm">
        <label>Blog title<input name="title" required maxlength="120" placeholder="Enter a title"></label>
        <label>Blog content<textarea name="content" rows="7" required maxlength="10000" placeholder="Write your blog here..."></textarea></label>
        <button class="button full" type="submit">Publish blog</button>
      </form>
      <p id="blogMessage" class="status" aria-live="polite"></p>
      <button id="logoutButton" class="button secondary full" type="button">Logout</button>
    </section>
  </main>
  <footer>BlogSpace · Share your ideas</footer>
  <script src="auth.js"></script>
</body>
</html>
